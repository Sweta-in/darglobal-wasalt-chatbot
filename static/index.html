<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DarGlobal &amp; Wasalt Assistant</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1b1f24;--muted:#69727d;--accent:#1f3a5f;--border:#e3e6ea;--user:#1f3a5f;--userText:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1217;--card:#171c23;--text:#e8eaed;--muted:#98a2ad;--accent:#7fb0ff;--border:#262d36;--user:#2c4f80;--userText:#fff}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:820px;padding:18px 16px 8px}
h1{font-size:19px;margin:0}header p{margin:2px 0 0;color:var(--muted);font-size:13px}
#chat{flex:1;width:100%;max-width:820px;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--border);background:var(--card)}
.user{align-self:flex-end;background:var(--user);color:var(--userText);border-color:transparent}
.bot{align-self:flex-start}
.src{margin-top:8px;font-size:12px;color:var(--muted);white-space:normal}
.src a{color:var(--accent);text-decoration:none}.src a:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--card);color:var(--text);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--accent)}
form{width:100%;max-width:820px;display:flex;gap:8px;padding:10px 16px 18px}
input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit}
button.send{padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
button.send:disabled{opacity:.5;cursor:default}
</style></head>
<body>
<header><h1>DarGlobal &amp; Wasalt Assistant</h1>
<p>Ask about DarGlobal projects, partners and press, or Wasalt listings. Answers come from publicly scraped pages.</p></header>
<div id="chat"></div>
<form id="f"><input id="q" placeholder="e.g. What projects does DarGlobal have in Oman?" autocomplete="off" maxlength="500">
<button class="send" id="b">Send</button></form>
<script>
const chat=document.getElementById('chat'),q=document.getElementById('q'),b=document.getElementById('b');
let history=[];
function add(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function sources(el,list){if(!list||!list.length)return;const s=document.createElement('div');s.className='src';s.append('Sources: ');
 list.forEach((x,i)=>{const a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent='['+x.n+'] '+x.title.slice(0,50);s.append(a);if(i<list.length-1)s.append(' · ')});el.appendChild(s)}
async function ask(text){
 if(!text.trim())return;add(text,'user');q.value='';b.disabled=true;const w=add('Thinking…','bot');
 try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history.slice(-6)})});
  const d=await r.json();w.textContent=d.answer;sources(w,d.sources);
  history.push({role:'user',content:text},{role:'assistant',content:d.answer});
 }catch(e){w.textContent='Something went wrong. Please try again.'}
 b.disabled=false;chat.scrollTop=chat.scrollHeight;q.focus()}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();ask(q.value)});
const intro=add('Hi! Try one of these:','bot');const c=document.createElement('div');c.className='chips';c.style.marginTop='8px';
['Tell me about Trump Tower Jeddah','What is DarGlobal?','Which brands does DarGlobal partner with?','What is Wasalt?'].forEach(t=>{const x=document.createElement('button');x.type='button';x.className='chip';x.textContent=t;x.onclick=()=>ask(t);c.appendChild(x)});intro.appendChild(c);
</script></body></html>
